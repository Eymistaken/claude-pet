# AppImage'i derler; VERSION dosyasindaki surumun etiketi henuz yoksa
# surum olarak yayinlar.
#
# NEDEN HER ITMEDE DERLIYOR AMA HER ITMEDE YAYINLAMIYOR: derleme, bu depodaki
# tek gercek entegrasyon testi. gtk4-layer-shell kaynaktan derleniyor, ldd
# kapanisi toplaniyor, 18 typelib bir araya geliyor -- bunlarin bozuldugunu
# ancak derleyerek gorursun. Yayin ise bir KARAR, ve o karari VERSION dosyasi
# veriyor: surumu artir, sonraki itmede surum cikar.
#
# ETIKET ONEKI: `v*` bu dalin (AppImage). Eklenti master'da `ext-v*`
# kullaniyor, boylece iki dal ayni surum numarasindayken etiketler carpismiyor.

name: AppImage

on:
  push:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'prompts/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # 24.04 BILINCLI: AppImage'in glibc tabani buradan geliyor (2.39) ve
    # gelistirme makinesiyle ayni. Daha yeni bir runner tabani yukseltir ve
    # README'deki uyumluluk tablosunu sessizce yanlislar.
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sürüm ve yayın kararı
        id: surum
        run: |
          SURUM=$(tr -d ' \n\r' < VERSION)
          echo "surum=$SURUM" >> "$GITHUB_OUTPUT"
          if gh release view "v$SURUM" >/dev/null 2>&1; then
            echo "yayinla=false" >> "$GITHUB_OUTPUT"
            echo "::notice::v$SURUM zaten yayınlanmış — yalnızca derlenecek."
          else
            echo "yayinla=true" >> "$GITHUB_OUTPUT"
            echo "::notice::v$SURUM yeni — derlenip yayınlanacak."
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Bağımlılıklar
        run: |
          sudo apt-get update -qq
          # gjs + GTK4/libadwaita calisma zamani ve typelib'leri paketlenecek;
          # -dev paketleri gtk4-layer-shell'i derlemek icin.
          sudo apt-get install -y --no-install-recommends \
            gjs libgtk-4-1 libgtk-4-dev libadwaita-1-0 libadwaita-1-dev \
            gir1.2-gtk-4.0 gir1.2-adw-1 gir1.2-graphene-1.0 \
            libgirepository1.0-dev gobject-introspection \
            libwayland-dev wayland-protocols meson ninja-build \
            libgdk-pixbuf2.0-bin libglib2.0-bin libvulkan1 desktop-file-utils zip

      - name: Testler
        run: |
          make check
          make replay

      - name: Derle
        run: bash tools/appimage.sh

      - name: Paketi doğrula
        run: |
          cd build
          rm -rf squashfs-root
          ./Claude_Pet-x86_64.AppImage --appimage-extract >/dev/null
          # Eksik kutuphane, sessizce bozuk bir AppImage demek: hedef makinede
          # acilmaz ve sebebi ancak orada gorunur. Burada yakalaniyor.
          EKSIK=$(for f in squashfs-root/usr/bin/gjs squashfs-root/usr/lib/*.so*; do
                    LD_LIBRARY_PATH=squashfs-root/usr/lib ldd "$f" 2>/dev/null | grep 'not found'
                  done | sort -u)
          if [ -n "$EKSIK" ]; then echo "EKSIK KUTUPHANE:"; echo "$EKSIK"; exit 1; fi
          test -f squashfs-root/usr/lib/libgtk4-layer-shell.so.0
          test -f squashfs-root/usr/lib/girepository-1.0/Gtk4LayerShell-1.0.typelib
          test -f squashfs-root/assets/animations.json
          echo "kapanış tam · $(ls squashfs-root/usr/lib/*.so* | wc -l) kütüphane"

      - uses: actions/upload-artifact@v4
        with:
          name: Claude_Pet-x86_64-${{ steps.surum.outputs.surum }}
          path: |
            build/Claude_Pet-x86_64.AppImage
            build/SHA256SUMS

      - name: Yayınla
        if: steps.surum.outputs.yayinla == 'true'
        run: |
          SURUM="${{ steps.surum.outputs.surum }}"
          # Ön sürüm: pencere davranışı hâlâ gerçek bir KWin oturumunda
          # sınanmadı. Bu satır, KDE testi yapılana kadar kalmalı.
          gh release create "v$SURUM" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "v$SURUM" \
            --generate-notes \
            --notes-file .github/release-notes.md \
            build/Claude_Pet-x86_64.AppImage build/SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
